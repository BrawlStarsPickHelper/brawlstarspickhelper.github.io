# 이 파일은 저장소의 .github/workflows/seed.yml 경로에 넣어야 동작합니다.
# 자동 스케줄 없이, 필요할 때 수동으로만 실행합니다.
name: Seed Player Tags From Leaderboards

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run seed
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

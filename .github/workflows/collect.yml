# 이 파일은 저장소의 .github/workflows/collect.yml 경로에 넣어야 동작합니다.
name: Collect Brawl Stars Ranked Battles

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 실행 (필요시 간격 조정)
  workflow_dispatch: {}       # 수동 실행 버튼도 추가

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run collect
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MIN_RANK_TROPHY: ${{ secrets.MIN_RANK_TROPHY }}

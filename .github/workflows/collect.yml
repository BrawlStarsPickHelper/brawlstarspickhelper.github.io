# 이 파일은 저장소의 .github/workflows/collect.yml 경로에 넣어야 동작합니다.
name: Collect Brawl Stars Ranked Battles

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 실행 (필요시 간격 조정)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true로 두면 DB에 안 쓰고 soloRanked 원본 JSON만 로그로 출력"
        type: boolean
        default: true
      dry_run_tag:
        description: "dry_run일 때 배틀로그를 확인할 플레이어 태그 (예: #ABCDEFG)"
        type: string
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run collect
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TAGS_PER_RUN: "500"
          MIN_RANK_LEVEL: ${{ secrets.MIN_RANK_LEVEL }} # 비워두면 기본값 13(신화 I) 사용
          # 스케줄 실행(cron)에는 inputs가 비어있으므로 자동으로 false가 됨
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_TAG: ${{ inputs.dry_run_tag }}
